min_version = "2026.7.17"

[settings]
minimum_release_age = "7d"
lockfile = true
locked = true
locked_verify_provenance = true
gpg_verify = true

[tools]
python = "3.11"
"aqua:suzuki-shunsuke/pinact" = "4.1.1"
"aqua:zizmorcore/zizmor" = "1.29.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:betterleaks/betterleaks" = "1.7.3"

[tasks.test]
description = "Run unit, privacy, and syntax tests"
run = """
python3 -m unittest discover -s tests -v
python3 -m py_compile plugins/human-distiller/skills/human-distiller/scripts/human_distiller.py
"""

[tasks.check]
description = "Run project and supply-chain checks"
run = """
mise run test
pinact run -fix=false -verify-comment -min-age 7
actionlint
zizmor .
shellcheck mise-tasks/*
betterleaks git .
"""
